
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal do Cliente | PR Plásticos</title>


<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #edf3fa;
    color: #243b53;
    min-height: 100vh;
    padding: 30px 16px;
  }

  .container {
    max-width: 440px;
    margin: 40px auto;
    padding: 32px 28px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(23, 75, 135, 0.12);
    border-top: 6px solid #174b87;
    text-align: center;
  }

  h1 {
    color: #174b87;
    font-size: 26px;
    margin-bottom: 8px;
  }

  h2 {
    color: #174b87;
  }

  p {
    color: #60758b;
  }

  input,
  button {
    width: 100%;
    padding: 14px;
    margin-top: 14px;
    border-radius: 8px;
    font-size: 16px;
  }

  input {
    border: 1px solid #cbd8e6;
    background: #f8fbff;
    outline: none;
  }

  input:focus {
    border-color: #174b87;
  }

  button {
    border: none;
    background: #174b87;
    color: #ffffff;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }

  button:hover {
    background: #103965;
  }

  #mensagem {
    margin-top: 16px;
    color: #174b87;
    font-size: 14px;
  }

  #areaCliente {
    display: none;
  }
</style>

  
</head>
<body>
  <div class="container">
    <img
  src="https://www.image2url.com/r2/default/images/png-to-jpg-1790823376697-5f824a9f-5830-4d00-ba3a-85c849ca83c2.jpg"
      alt="PR Plásticos Recicláveis" 
      style="width:180px;max-width:100%;height:auto;">
<p style="font-size:20px;font-weight:bold;color:#174b87;">Portal do Cliente</p>

    <form id="loginForm">
      <input id="email" type="email"
        placeholder="Seu e-mail" required>
      <input id="senha" type="password"
        placeholder="Sua senha" required>
      <button type="submit">Entrar no portal</button>
    </form>

    <div id="mensagem" role="status"></div>

    
<section id="areaCliente">
  <h2 id="boasVindas"></h2>
  <p id="empresaCliente"></p>

  <hr style="border:0;border-top:1px solid #dbe5f0;margin:24px 0;">

  <h3 style="color:#174b87;text-align:left;">
    Meus pedidos
  </h3>

  <div id="listaPedidos">
    Carregando pedidos...
  </div>

  <button id="sair" type="button">Sair do portal</button>
</section>

   
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
const SUPABASE_URL = "https://tyetobhxkdhrvtsludym.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_aoEHgmcZzHbSjXjlcJiuhw_5ty-5mhJ";

    const cliente = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const form = document.getElementById("loginForm");
    const mensagem = document.getElementById("mensagem");
    const area = document.getElementById("areaCliente");

    
async function carregarPedidos() {
  const lista = document.getElementById("listaPedidos");
  lista.textContent = "Carregando pedidos...";

  const { data, error } = await cliente
    .from("pedidos")
    .select("numero, data_pedido, status, total")
    .order("data_pedido", { ascending: false })
    .limit(50);

  if (error) {
    lista.textContent = "Não foi possível carregar os pedidos.";
    console.error(error);
    return;
  }

  if (!data || data.length === 0) {
    lista.textContent = "Nenhum pedido encontrado.";
    return;
  }

  lista.replaceChildren();

  data.forEach((pedido) => {
    const card = document.createElement("div");
    card.style.cssText =
      "padding:14px;margin:12px 0;border:1px solid #dbe5f0;border-radius:8px;text-align:left;";

    const titulo = document.createElement("strong");
    titulo.style.color = "#174b87";
    titulo.textContent = pedido.numero || "Pedido";

    const detalhes = document.createElement("p");
    const dataPedido = pedido.data_pedido
      ? new Date(pedido.data_pedido).toLocaleDateString("pt-BR")
      : "Não informada";
    const total = Number(pedido.total || 0).toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL"
    });

    detalhes.textContent =
      "Data: " + dataPedido +
      " | Status: " + (pedido.status || "Em análise") +
      " | Total: " + total;

    card.append(titulo, detalhes);
    lista.append(card);
  });
}


async function carregarPerfil(usuario) {
  const { data, error } = await cliente
    .from("usuarios_portal")
    .select("nome, empresa, ativo")
    .eq("id", usuario.id)
    .single();

  if (error || !data || !data.ativo) {
    await cliente.auth.signOut();
    mensagem.textContent =
      "Acesso não liberado. Entre em contato com a PR Plásticos.";
    return;
  }

  form.style.display = "none";
  area.style.display = "block";

  document.getElementById("boasVindas").textContent =
    "Olá, " + data.nome;

  document.getElementById("empresaCliente").textContent =
    "Empresa: " + data.empresa;

  mensagem.textContent = "";

  await carregarPedidos();
}

   
  </script>
</body>
</html>
